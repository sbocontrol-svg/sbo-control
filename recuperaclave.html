<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Clave - S.B.O. Control</title>
    <style>
        /* Fondo oscuro igual a la Foto 1 */
        body { 
            background-color: #0f172a; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            margin: 0; 
            box-sizing: border-box;
        }

        /* Tarjeta blanca flotante sobre el fondo oscuro */
        .modal-content { 
            background: #ffffff; 
            width: 100%; 
            max-width: 440px; 
            padding: 24px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            box-sizing: border-box;
        }

        /* Caja de datos cliente/licencia */
        .info-box {
            background: #f1f8f3; 
            border-radius: 12px; 
            padding: 14px; 
            margin: 15px 0;
        }

        .btn-main { background: #1e7e34; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-action { background: #0077c5; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; margin-top: 8px; margin-bottom: 12px; box-sizing: border-box; background: #fafafa; font-size: 14px; }
    </style>
</head>
<body>
    <div class="modal-content">
        <h2 style="color: #1e7e34; margin-top: 0; font-size: 22px;">💳 Mi Licencia y Suscripción</h2>
        
        <div class="info-box">
            <p style="margin: 0 0 8px 0; font-size: 15px;"><strong>Cliente:</strong> <span id="lblCliente" style="color: #1e7e34;">Sin nombre registrado</span></p>
            <p style="margin: 0; font-size: 15px;"><strong>Licencia:</strong> <span id="lblLicencia" style="color: #1e7e34;">Sin licencia seleccionada</span></p>
        </div>
        
        <label style="font-weight: 500; font-size: 15px;">🔑 ¿Ingresar o renovar clave?</label>
        <input type="text" id="txtClaveRenovacion" placeholder="Ej: SBO-2026-AB12">
        <button class="btn-main" onclick="activarNuevaLicencia()">✨ Activar Clave</button>
        
        <p style="text-align: center; margin-top: 20px; margin-bottom: 8px; color: #333;">¿Querés cambiar la clave?</p>
        <button class="btn-action" onclick="solicitarRenovacionWA()">💬 Contactar al Soporte</button>
        <button onclick="window.history.back()" style="width: 100%; background: none; border: none; margin-top: 12px; cursor: pointer; font-weight: bold; color: #555; font-size: 14px;">⬅️ Volver</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cliente = localStorage.getItem('sbo_nombre') || 'Sin nombre registrado';
            const licencia = localStorage.getItem('sbo_licenciaElegida') || localStorage.getItem('sbo_licencia_plan') || 'Sin licencia seleccionada';
            
            document.getElementById('lblCliente').innerText = cliente;
            document.getElementById('lblLicencia').innerText = licencia;
        });

        function activarNuevaLicencia() {
            const clave = document.getElementById('txtClaveRenovacion').value.trim().toUpperCase();
            if (!clave) return alert('Ingresá una clave');
            localStorage.setItem('sbo_licencia_clave_activa', clave);
            alert('¡Clave activada!');
            location.reload();
        }

        function solicitarRenovacionWA() {
            const clienteActual = localStorage.getItem('sbo_nombre') || 'Sin nombre';
            const licenciaActual = localStorage.getItem('sbo_licenciaElegida') || 'Sin licencia';
            window.open(`https://wa.me/5492364502082?text=Hola, quiero renovar mi clave. Mi nombre es: ${clienteActual} y mi licencia es: ${licenciaActual}`, '_blank');
        }
    </script>
</body>
</html>
