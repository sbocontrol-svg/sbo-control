<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <title>Recuperar Clave - S.B.O. Control</title>
    <style>
        :root { --primary-color: #059669; }
        body { 
            background-color: #0f172a; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            margin: 0; 
            box-sizing: border-box;
        }

        .modal-content { 
            background: #ffffff; 
            color: #1e293b;
            width: 100%; 
            max-width: 440px; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            box-sizing: border-box;
            border: 1px solid #e2e8f0;
        }

        .info-box {
            background: #f8fafc; 
            border: 1px dashed #cbd5e1;
            border-radius: 12px; 
            padding: 14px; 
            margin: 14px 0;
        }

        .btn-main { background: var(--primary-color); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-action { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 6px; margin-bottom: 12px; box-sizing: border-box; background: #f8fafc; font-size: 14px; text-transform: uppercase; color: #1e293b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="modal-content">
        <h2 style="color: var(--primary-color); margin-top: 0; font-size: 1.25rem; font-weight: 800;">💳 Mi Licencia y Suscripción</h2>
        
        <div class="info-box">
            <p style="margin: 0 0 6px 0; font-size: 0.9rem;"><strong>Cliente:</strong> <span id="lblCliente" style="color: var(--primary-color); font-weight: 700;">Sin nombre registrado</span></p>
            <p style="margin: 0; font-size: 0.9rem;"><strong>Licencia:</strong> <span id="lblLicencia" style="color: var(--primary-color); font-weight: 700;">Sin licencia seleccionada</span></p>
        </div>
        
        <label style="font-weight: 600; font-size: 0.9rem;">🔑 ¿Ingresar o activar clave?</label>
        <input type="text" id="txtClaveRenovacion" placeholder="Ej: SBO-2026-AB12">
        <button class="btn-main" onclick="activarNuevaLicencia()">✨ Activar Clave</button>
        
        <p style="text-align: center; margin-top: 18px; margin-bottom: 6px; color: #4b5563; font-size: 0.85rem; font-weight: 600;">¿Necesitás una clave o querés renovarla?</p>
        <button class="btn-action" onclick="solicitarRenovacionWA()">💬 Contactar al Soporte</button>
        <button onclick="window.history.back()" style="width: 100%; background: none; border: none; margin-top: 12px; cursor: pointer; font-weight: 600; color: #64748b; font-size: 0.85rem;">⬅️ Volver al Inicio</button>
    </div>

    <script>
        const NUMERO_WHATSAPP_SBO = "5492364502082";

        document.addEventListener('DOMContentLoaded', () => {
            const cliente = localStorage.getItem('sbo_nombre') || 'Sin nombre registrado';
            const licencia = localStorage.getItem('sbo_licenciaElegida') || localStorage.getItem('sbo_licencia_plan') || 'Sin licencia seleccionada';
            
            document.getElementById('lblCliente').innerText = cliente;
            document.getElementById('lblLicencia').innerText = licencia;
        });

        function activarNuevaLicencia() {
            const claveInput = document.getElementById('txtClaveRenovacion').value.trim().toUpperCase();
            if (!claveInput) return alert('¡Ingresá una clave!');

            // Chequeamos si existe en las claves creadas por el admin o la guardamos directamente
            const clavesCreadas = JSON.parse(localStorage.getItem('sbo_db_claves_creadas')) || [];
            const claveValida = clavesCreadas.find(c => c.clave.toUpperCase() === claveInput);

            if (claveValida) {
                localStorage.setItem('sbo_claveSecreta', claveValida.clave);
                localStorage.setItem('sbo_licenciaElegida', claveValida.licencia);
                if(claveValida.cliente && claveValida.cliente !== "Sin nombre") {
                    localStorage.setItem('sbo_nombre', claveValida.cliente);
                }
            } else {
                // Si no está en la base local, la guardamos igual por si se la diste manual
                localStorage.setItem('sbo_claveSecreta', claveInput);
            }

            alert('¡Clave activada con éxito!');
            window.location.href = 'index.html';
        }

        function solicitarRenovacionWA() {
            const clienteActual = localStorage.getItem('sbo_nombre') || 'Sin nombre';
            const licenciaActual = localStorage.getItem('sbo_licenciaElegida') || 'Sin licencia';
            const huella = localStorage.getItem('sbo_huellaHardware') || 'HW-NO-REGISTRADO';

            const msg = encodeURIComponent(`¡Hola! Necesito soporte o renovación de clave para SBO Control.\n\n👤 Cliente: ${clienteActual}\n📋 Licencia: ${licenciaActual}\n🔒 HW: ${huella}`);
            
            window.open(`https://wa.me/${NUMERO_WHATSAPP_SBO}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
