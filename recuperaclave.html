<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <title>Recuperación de Clave - S.B.O. Control</title>
    <style>
        :root { --primary-color: #059669; }
        body { 
            background-color: #0f172a; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            margin: 0; 
            box-sizing: border-box;
        }
        .modal-content { 
            background: #ffffff; 
            color: #1e293b;
            width: 100%; 
            max-width: 440px; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            box-sizing: border-box;
            border: 1px solid #e2e8f0;
        }
        .form-group { margin-bottom: 12px; text-align: left; }
        .btn-main { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-whatsapp { background: #25d366; color: white; border: none; padding: 11px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 4px; box-sizing: border-box; background: #f8fafc; font-size: 14px; color: #1e293b; font-weight: bold; }
        .result-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 10px;
            text-align: center;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="modal-content">
        <h2 style="color: var(--primary-color); margin-top: 0; font-size: 1.25rem; font-weight: 800; text-align: center;">🔑 Recuperación Automática</h2>
        
        <div class="form-group">
            <label style="font-weight: 600; font-size: 0.9rem;">👤 Nombre y Apellido:</label>
            <input type="text" id="txtRecupNombre" placeholder="Ingresá tu nombre completo...">
        </div>

        <div class="form-group">
            <label style="font-weight: 600; font-size: 0.9rem;">📋 Licencia:</label>
            <input type="text" id="txtRecupLicencia" placeholder="Ej: Licencia Activa Mensual...">
        </div>

        <button id="btnBuscar" class="btn-main" onclick="buscarClaveAutomatica()">🔍 Buscar mi Clave</button>
        
        <p style="margin: 12px 0 2px 0; font-size: 0.78rem; color: #94a3b8; font-weight: 600; text-align: left;">Estado / Clave</p>
        
        <div id="cajonResultado" class="result-box">
            <span id="lblClaveGenerada" style="font-size: 0.85rem; color: #475569; font-weight: 600;">Esperando datos...</span>
        </div>
        
        <a id="linkWhatsappDirecto" href="#" class="btn-whatsapp" target="_blank">💬 Soporte / Contacto WhatsApp</a>
        
        <button onclick="window.location.href='index.html?abrirIngreso=true'" style="width: 100%; background: none; border: none; margin-top: 12px; cursor: pointer; font-weight: 600; color: #64748b; font-size: 0.85rem;">⬅️ Volver al Inicio</button>
    </div>

    <script>
        const NUMERO_WHATSAPP_SBO = "5492364502082";
        let intentosFallidos = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const clienteGuardado = localStorage.getItem('sbo_nombre');
            const licenciaGuardada = localStorage.getItem('sbo_licenciaElegida') || localStorage.getItem('sbo_licencia_plan');
            
            if (clienteGuardado) document.getElementById('txtRecupNombre').value = clienteGuardado;
            if (licenciaGuardada) document.getElementById('txtRecupLicencia').value = licenciaGuardada;

            actualizarEnlaceWhatsApp();
        });

        function actualizarEnlaceWhatsApp() {
            const clienteActual = document.getElementById('txtRecupNombre').value.trim() || 'Sin nombre';
            const licenciaActual = document.getElementById('txtRecupLicencia').value.trim() || 'Sin licencia';
            const huella = localStorage.getItem('sbo_huellaHardware') || 'HW-NO-REGISTRADO';

            const msg = encodeURIComponent(`¡Hola! Necesito asistencia con SBO Control.\n\n👤 Cliente: ${clienteActual}\n📋 Licencia: ${licenciaActual}\n🔒 HW: ${huella}`);
            document.getElementById('linkWhatsappDirecto').href = `https://wa.me/${NUMERO_WHATSAPP_SBO}?text=${msg}`;
        }

        document.getElementById('txtRecupNombre').addEventListener('input', actualizarEnlaceWhatsApp);
        document.getElementById('txtRecupLicencia').addEventListener('input', actualizarEnlaceWhatsApp);

        function obtenerAcronimo(texto) {
            if (!texto) return "SBO";
            return texto.trim().split(/\s+/)
                .map(palabra => palabra[0])
                .join('')
                .toUpperCase()
                .substring(0, 4);
        }

        function obtenerHWCortoActual() {
            let huella = localStorage.getItem('sbo_huellaHardware');
            if (!huella) {
                huella = "HW-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem('sbo_huellaHardware', huella);
            }
            const partes = huella.split('-');
            return partes[1] ? partes[1].substring(0, 4).toUpperCase() : "T5SR";
        }

        function buscarClaveAutomatica() {
            const nombreIngresado = document.getElementById('txtRecupNombre').value.trim();
            const licenciaIngresada = document.getElementById('txtRecupLicencia').value.trim();
            const lblResultado = document.getElementById('lblClaveGenerada');
            const cajon = document.getElementById('cajonResultado');

            if (!nombreIngresado || !licenciaIngresada) {
                return alert('Por favor, completá tu nombre y la licencia.');
            }

            let claveEncontrada = null;
            const clavesCreadas = JSON.parse(localStorage.getItem('sbo_db_claves_creadas')) || [];
            
            const encontrada = clavesCreadas.find(c => {
                const cCliente = (c.cliente || '').toLowerCase();
                const cLicencia = (c.licencia || '').toLowerCase();
                return cCliente.includes(nombreIngresado.toLowerCase()) && cLicencia.includes(licenciaIngresada.toLowerCase());
            });

            if (encontrada) {
                claveEncontrada = encontrada.clave;
                if (encontrada.huella) {
                    localStorage.setItem('sbo_huellaHardware', encontrada.huella);
                }
            } else {
                const acroLicencia = obtenerAcronimo(licenciaIngresada);
                const hwCorto = obtenerHWCortoActual();
                const acroCliente = obtenerAcronimo(nombreIngresado);

                claveEncontrada = `${acroLicencia}-${hwCorto}-${acroCliente}`;
            }

            if (claveEncontrada) {
                intentosFallidos = 0;
                cajon.style.borderColor = "#10b981";
                cajon.style.background = "#ecfdf5";
                
                lblResultado.style.color = "#065f46";
                lblResultado.innerHTML = `✅ <strong>¡Clave recuperada!</strong> Volvé al inicio y pegá: <span style="font-weight: 900; color: #047857;">${claveEncontrada}</span>`;

                localStorage.setItem('sbo_claveSecreta', claveEncontrada);
            } else {
                intentosFallidos++;
                cajon.style.borderColor = "#ef4444";
                cajon.style.background = "#fef2f2";
                lblResultado.style.color = "#991b1b";

                if (intentosFallidos < 3) {
                    lblResultado.innerText = `❌ Error al procesar (Intento ${intentosFallidos}/3)`;
                    alert(`Verificá los datos ingresados. Te quedan ${3 - intentosFallidos} intento(s).`);
                } else {
                    lblResultado.innerText = `⚠️ Límite alcanzado. Contactá a soporte.`;
                    document.getElementById('txtRecupNombre').disabled = true;
                    document.getElementById('txtRecupLicencia').disabled = true;
                    document.getElementById('btnBuscar').style.display = 'none';
                    alert("Agotaste los intentos. Por favor, comunicate con soporte.");
                }
            }
        }
    </script>
</body>
</html>
