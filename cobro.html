<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.B.O. - Cobro</title>

  <link rel="icon" type="image/jpeg" href="logosbo.jpg">
  <link rel="apple-touch-icon" href="logosbo.jpg">
  <meta name="theme-color" content="#059669">

  <style>
    :root {
      --primary-color: #059669;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; margin: 0; padding: 15px; color: #1f2937; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    .card { background: white; width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.25); }
    
    .negocio-titulo { font-size: 1.1rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 10px 0; }
    
    .billetera-tag { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; margin-bottom: 12px; }
    
    .monto { font-size: 2.5rem; font-weight: 800; color: #0f172a; margin: 5px 0 15px 0; letter-spacing: -1px; }

    .info-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 14px; border-radius: 12px; margin-top: 10px; }
    .qr-contenedor { background: white; display: inline-block; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin: 8px 0; }
    .qr-img { width: 180px; height: 180px; display: block; border-radius: 6px; }

    .info-dato { background: #e2e8f0; color: #0f172a; padding: 10px; border-radius: 8px; margin: 8px 0; word-break: break-all; font-family: monospace; font-size: 1.05rem; font-weight: bold; }
    
    .btn-copiar { background: #0284c7; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 2px 6px rgba(2,132,199,0.2); }
    .btn-copiar:active { transform: scale(0.97); }

    .btn-volver { margin-top: 15px; border: none; background: none; color: #94a3b8; font-weight: 600; font-size: 0.95rem; cursor: pointer; padding: 8px 16px; border-radius: 8px; }
    .btn-volver:active { color: #64748b; }
  </style>
</head>
<body>

<div class="card">
    <h3 id="tituloNegocio" class="negocio-titulo">Cobrar</h3>
    <div id="tagBilletera" class="billetera-tag">Cargando...</div>
    <div class="monto" id="displayMonto">$0,00</div>
    
    <div id="contenedorPago">
        <!-- Contenido dinámico con QR -->
    </div>
    
    <button class="btn-volver" onclick="window.history.back()">← Volver atrás</button>
</div>

<script>
    // Recuperar datos con compatibilidad de keys
    const rawMonto = localStorage.getItem('sbo_monto_actual') || localStorage.getItem('sbo_sbo_monto_actual') || '0';
    const alias = localStorage.getItem('sbo_alias') || localStorage.getItem('sbo_sbo_alias') || '';
    const billetera = localStorage.getItem('sbo_billetera') || localStorage.getItem('sbo_sbo_billetera') || 'mp';
    const nombreNegocio = localStorage.getItem('sbo_config_nombre') || localStorage.getItem('sbo_sbo_config_nombre') || 'Mi Emprendimiento';

    // Formatear monto
    const montoNum = parseFloat(rawMonto) || 0;
    document.getElementById('displayMonto').innerText = '$' + montoNum.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    document.getElementById('tituloNegocio').innerText = nombreNegocio;

    const tag = document.getElementById('tagBilletera');
    const cont = document.getElementById('contenedorPago');

    // Definir datos del QR según la billetera
    let qrData = '';
    let nombreBilletera = 'Mercado Pago';
    let bgTag = '#e0f2fe';
    let colorTag = '#0284c7';

    if (billetera === 'mp') {
        nombreBilletera = 'Mercado Pago';
        qrData = alias ? `https://link.mercadopago.com.ar/${alias}` : 'Sin Alias';
        bgTag = '#e0f2fe';
        colorTag = '#0284c7';
    } else if (billetera === 'uala') {
        nombreBilletera = 'Ualá';
        qrData = alias ? `https://ualaria.com/${alias}` : 'Sin Alias';
        bgTag = '#ffe4e6';
        colorTag = '#e11d48';
    } else {
        nombreBilletera = (billetera === 'cuentadni' ? 'Cuenta DNI' : 'Transferencia / MODO');
        qrData = alias;
        bgTag = billetera === 'cuentadni' ? '#dcfce7' : '#f1f5f9';
        colorTag = billetera === 'cuentadni' ? '#15803d' : '#475569';
    }

    tag.innerText = nombreBilletera;
    tag.style.background = bgTag;
    tag.style.color = colorTag;

    // Generar URL de la API de QR
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(qrData)}`;

    cont.innerHTML = `
        <div class="info-box">
            <span style="font-size:0.8rem; color:#64748b; font-weight:bold; display:block; margin-bottom:4px;">ESCANEÁ CON TU CELU:</span>
            <div class="qr-contenedor">
                <img src="${qrApiUrl}" alt="QR de Pago" class="qr-img">
            </div>
            <div style="font-size:0.8rem; color:#64748b; font-weight:bold; margin-top:8px;">ALIAS / CBU:</div>
            <div class="info-dato" id="lblAlias">${alias || 'Sin Alias Configurado'}</div>
            <button class="btn-copiar" id="btnCopiar" onclick="copiarAlias()">📋 Copiar Alias</button>
        </div>
    `;

    function copiarAlias() {
        if (!alias) return;
        navigator.clipboard.writeText(alias).then(() => {
            const btn = document.getElementById('btnCopiar');
            if (btn) {
                btn.innerText = '✅ ¡Copiado!';
                btn.style.background = '#059669';
                setTimeout(() => {
                    btn.innerText = '📋 Copiar Alias';
                    btn.style.background = '#0284c7';
                }, 2000);
            }
        });
    }
</script>

</body>
</html>
